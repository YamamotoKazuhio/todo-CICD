version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/todo-app
file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: deployment/scripts/application_stop.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: deployment/scripts/after_install.sh
      timeout: 300
      runas: ec2-user
  ApplicationStart:
    - location: deployment/scripts/application_start.sh
      runas: root
