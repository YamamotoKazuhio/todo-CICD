name: CI/CD Workflow

on:
  push:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # バージョンを上げました

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: gd, mbstring, xml, ctype, iconv # Laravel等で必要な基本拡張を追加

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Clear Application Cache
        run: php artisan cache:clear

      - name: Check with PHPStan
        # 失敗しても次に進ませたい場合は continue-on-error: true を使います
        run: vendor/bin/phpstan analyse --error-format=github --configuration=phpstan.neon

      - name: Run Unit Tests
        run: vendor/bin/phpunit --coverage-html tests/Report

      - name: Upload Coverage Report
        if: always() # テストが失敗してもレポートは保存する
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/Report/
          retention-days: 7